services:
  postgres:
    image: postgres:16
    container_name: shortener-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: url_shortener
    ports:
      - "5432:5432"
    volumes:
      - shortener-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d url_shortener"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  shortener-data: