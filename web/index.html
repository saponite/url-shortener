<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Сокращение ссылок</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .card {
            background: #fff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
        }
        h1 { margin: 0 0 20px; font-size: 20px; font-weight: 600; }

        /* Вкладки */
        .tabs {
            display: flex;
            gap: 4px;
            background: #f5f5f7;
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 8px 10px;
            border: 0;
            background: transparent;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #6e6e73;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #fff;
            color: #1d1d1f;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .tab-btn:disabled { cursor: not-allowed; opacity: 0.5; }

        .panel { display: none; }
        .panel.active { display: block; }

        form { display: flex; gap: 8px; }
        form.stacked { flex-direction: column; }
        input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d1d6;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            width: 100%;
        }
        input:focus { border-color: #0071e3; }
        input::placeholder { color: #c7c7cc; }

        button {
            padding: 10px 18px;
            background: #0071e3;
            color: #fff;
            border: 0;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }
        button:disabled { background: #c7c7cc; cursor: not-allowed; }

        .result {
            margin-top: 18px;
            padding: 12px 14px;
            background: #f5f5f7;
            border-radius: 8px;
            font-size: 14px;
            word-break: break-all;
            display: none;
        }
        .result.show { display: block; }
        .result a { color: #0071e3; text-decoration: none; }
        .result a:hover { text-decoration: underline; }
        .result.error { color: #d70015; }

        /* Статус аккаунта */
        .account-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 16px;
            padding: 10px 14px;
            background: #eafaf0;
            border: 1px solid #b8ecc9;
            border-radius: 8px;
            font-size: 13px;
            color: #1e6b3d;
        }
        .account-bar.show { display: flex; }
        .account-bar .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #34c759;
            display: inline-block;
            margin-right: 6px;
            flex-shrink: 0;
        }
        .account-bar .left { display: flex; align-items: center; }
        .logout-link {
            background: none;
            border: 0;
            color: #6e6e73;
            font-size: 13px;
            cursor: pointer;
            padding: 0;
        }
        .logout-link:hover { text-decoration: underline; }

        .field-label {
            display: block;
            font-size: 13px;
            color: #6e6e73;
            margin-bottom: 6px;
        }
        .field-group { margin-bottom: 12px; }
        .switch-hint {
            margin-top: 14px;
            font-size: 13px;
            color: #6e6e73;
            text-align: center;
        }
        .switch-hint button {
            background: none;
            border: 0;
            color: #0071e3;
            cursor: pointer;
            padding: 0;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Сокращение ссылок</h1>

    <div class="account-bar" id="accountBar">
        <span class="left"><span class="dot"></span><span id="accountLabel"></span></span>
        <button class="logout-link" id="logoutBtn" type="button">Выйти</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tabBtnRegister" type="button" data-tab="register">Регистрация</button>
        <button class="tab-btn" id="tabBtnShorten" type="button" data-tab="shorten">Сокращение ссылок</button>
    </div>

    <!-- Вкладка регистрации -->
    <div class="panel active" id="panelRegister">
        <form id="registerForm" class="stacked">
            <div class="field-group">
                <label class="field-label" for="regFirstName">Имя</label>
                <input id="regFirstName" type="text" placeholder="Введите имя" required autocomplete="given-name">
            </div>
            <div class="field-group">
                <label class="field-label" for="regLastName">Фамилия</label>
                <input id="regLastName" type="text" placeholder="Введите фамилию" required autocomplete="family-name">
            </div>
            <div class="field-group">
                <label class="field-label" for="regEmail">Эл. почта</label>
                <input id="regEmail" type="email" placeholder="Например, ivan@yandex.ru" required autocomplete="email">
                <small style="display:block; margin-top:6px; font-size:12px; color:#98989d;">Поддерживаются: yandex.ru, mail.ru, internet.ru, bk.ru, list.ru, inbox.ru</small>
            </div>
            <div class="field-group">
                <label class="field-label" for="regPassword">Пароль</label>
                <input id="regPassword" type="password" placeholder="Введите пароль" required autocomplete="new-password">
            </div>
            <button id="registerSubmit" type="submit">Зарегистрироваться</button>
        </form>
        <div class="result" id="registerResult"></div>
    </div>

    <!-- Вкладка сокращения ссылок -->
    <div class="panel" id="panelShorten">
        <form id="form">
            <input id="url" type="url" placeholder="Введите ссылку" required>
            <button id="submit" type="submit">Сократить</button>
        </form>
        <div class="result" id="result"></div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'shortener_account_username';

    // ---------- Вкладки ----------
    const tabButtons = document.querySelectorAll('.tab-btn');
    const panels = {
        register: document.getElementById('panelRegister'),
        shorten: document.getElementById('panelShorten'),
    };

    function switchTab(name) {
        tabButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.tab === name));
        Object.entries(panels).forEach(([key, el]) => el.classList.toggle('active', key === name));
    }

    tabButtons.forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    // ---------- Статус аккаунта ----------
    const accountBar = document.getElementById('accountBar');
    const accountLabel = document.getElementById('accountLabel');
    const logoutBtn = document.getElementById('logoutBtn');
    const tabBtnRegister = document.getElementById('tabBtnRegister');

    function renderAccountState() {
        const username = localStorage.getItem(STORAGE_KEY);
        if (username) {
            accountBar.classList.add('show');
            accountLabel.textContent = 'Вы вошли как ' + username;
            tabBtnRegister.disabled = true;
            switchTab('shorten');
        } else {
            accountBar.classList.remove('show');
            tabBtnRegister.disabled = false;
        }
    }

    logoutBtn.addEventListener('click', () => {
        localStorage.removeItem(STORAGE_KEY);
        renderAccountState();
        switchTab('register');
    });

    renderAccountState();

    // ---------- Форма регистрации ----------
    const registerForm = document.getElementById('registerForm');
    const registerSubmit = document.getElementById('registerSubmit');
    const registerResult = document.getElementById('registerResult');

    registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        registerSubmit.disabled = true;
        registerResult.className = 'result';
        registerResult.textContent = '';

        const firstName = document.getElementById('regFirstName').value.trim();
        const lastName = document.getElementById('regLastName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;

        try {
            const res = await fetch('/create_account', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    first_name: firstName,
                    last_name: lastName,
                    email: email,
                    password: password,
                }),
            });
            const text = await res.text();
            if (!res.ok) {
                registerResult.className = 'result show error';
                registerResult.textContent = text || 'Ошибка ' + res.status;
                return;
            }
            // Успешная регистрация: запоминаем пользователя (email) и переключаемся на сокращение ссылок
            localStorage.setItem(STORAGE_KEY, email);
            renderAccountState();
        } catch (err) {
            registerResult.className = 'result show error';
            registerResult.textContent = 'Ошибка сети: ' + err.message;
        } finally {
            registerSubmit.disabled = false;
        }
    });

    // ---------- Форма сокращения ссылок ----------
    const form = document.getElementById('form');
    const input = document.getElementById('url');
    const btn = document.getElementById('submit');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        btn.disabled = true;
        result.className = 'result';
        result.textContent = '';

        try {
            const res = await fetch('/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ original_url: input.value }),
            });
            const text = await res.text();
            if (!res.ok) {
                result.className = 'result show error';
                result.textContent = text || 'Ошибка ' + res.status;
                return;
            }
            const data = JSON.parse(text);
            result.className = 'result show';
            const a = document.createElement('a');
            a.href = data.short_url;
            a.target = '_blank';
            a.rel = 'noopener';
            a.textContent = data.short_url;
            result.append('Готово: ', a);
        } catch (err) {
            result.className = 'result show error';
            result.textContent = 'Ошибка сети: ' + err.message;
        } finally {
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
