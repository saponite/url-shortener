<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Сокращение ссылок</title>
    <link rel="stylesheet" href="/styles.css">
    <!-- Тему ставим до отрисовки — без вспышки светлой темы на тёмной. -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                var dark = t ? t === 'dark'
                    : matchMedia('(prefers-color-scheme: dark)').matches;
                if (dark) document.documentElement.classList.add('dark');
            } catch (e) {}
        })();
    </script>
</head>
<body>
<main class="app">
    <div class="card">

        <header class="header">
            <h1 class="title">Сокращение ссылок</h1>
            <button id="themeToggle" class="btn btn--icon" type="button"
                    aria-label="Переключить тему" title="Переключить тему">
                <svg class="icon theme-icon--sun" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path stroke-linecap="round" d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
                </svg>
                <svg class="icon theme-icon--moon" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path>
                </svg>
            </button>
        </header>

        <!-- Статус аккаунта -->
        <div id="accountBar" class="account-bar is-hidden">
            <span class="account-bar__left">
                <span class="account-bar__dot" aria-hidden="true"></span>
                <span id="accountLabel" class="truncate"></span>
            </span>
            <button id="logoutBtn" class="btn btn--ghost" type="button">Выйти</button>
        </div>

        <!-- Табы -->
        <div class="tabs" role="tablist" aria-label="Разделы">
            <button class="tab" id="tabShorten" type="button" role="tab"
                    aria-selected="true" aria-controls="panelShorten">Сократить</button>
            <button class="tab" id="tabAuth" type="button" role="tab"
                    aria-selected="false" aria-controls="panelAuth">Аккаунт</button>
        </div>

        <!-- ── Панель: сокращение ── -->
        <section id="panelShorten" role="tabpanel" aria-labelledby="tabShorten" tabindex="-1">
            <form id="shortenForm" novalidate>
                <label class="label" for="url">Ссылка</label>
                <div class="row">
                    <input id="url" class="input" type="url" inputmode="url"
                           placeholder="https://example.com/very/long/path" required
                           autocomplete="off" aria-describedby="urlError">
                    <button id="shortenSubmit" class="btn btn--primary" type="submit">
                        <span data-label>Сократить</span>
                    </button>
                </div>
                <p id="urlError" class="error is-hidden" role="alert"></p>
            </form>

            <!-- Результат -->
            <div id="result" class="result is-hidden" tabindex="-1">
                <p class="result__label">Готово — короткая ссылка:</p>
                <div class="result__body">
                    <a id="resultLink" class="result__link" href="#" target="_blank" rel="noopener"></a>
                    <button id="copyBtn" class="btn btn--outline" type="button">Копировать</button>
                </div>
            </div>

            <!-- История «Мои ссылки» — только для авторизованных -->
            <section id="historySection" class="history is-hidden">
                <h2 class="history__title">Мои ссылки</h2>
                <div id="historyBody" aria-live="polite"></div>
            </section>
        </section>

        <!-- ── Панель: аккаунт ── -->
        <section id="panelAuth" role="tabpanel" aria-labelledby="tabAuth" tabindex="-1" hidden>
            <!-- Вложенные табы вход/регистрация -->
            <div class="tabs" role="tablist" aria-label="Вход или регистрация">
                <button class="tab" id="tabLogin" type="button" role="tab"
                        aria-selected="true" aria-controls="loginForm">Вход</button>
                <button class="tab" id="tabRegister" type="button" role="tab"
                        aria-selected="false" aria-controls="registerForm">Регистрация</button>
            </div>

            <!-- Вход -->
            <form id="loginForm" role="tabpanel" aria-labelledby="tabLogin" novalidate>
                <div class="field">
                    <label class="label" for="loginEmail">Эл. почта</label>
                    <input id="loginEmail" class="input" type="email" inputmode="email"
                           placeholder="ivan@yandex.ru" required autocomplete="email"
                           aria-describedby="loginEmailError">
                    <p id="loginEmailError" class="error is-hidden" role="alert"></p>
                </div>
                <div class="field">
                    <label class="label" for="loginPassword">Пароль</label>
                    <input id="loginPassword" class="input" type="password" required
                           autocomplete="current-password" aria-describedby="loginPasswordError">
                    <p id="loginPasswordError" class="error is-hidden" role="alert"></p>
                </div>
                <button id="loginSubmit" class="btn btn--primary btn--block" type="submit">
                    <span data-label>Войти</span>
                </button>
                <p id="loginResult" class="form-message is-hidden" role="alert"></p>
            </form>

            <!-- Регистрация -->
            <form id="registerForm" role="tabpanel" aria-labelledby="tabRegister" novalidate hidden>
                <div class="grid-2">
                    <div class="field">
                        <label class="label" for="regFirstName">Имя</label>
                        <input id="regFirstName" class="input" type="text" placeholder="Иван"
                               required autocomplete="given-name" aria-describedby="regFirstNameError">
                        <p id="regFirstNameError" class="error is-hidden" role="alert"></p>
                    </div>
                    <div class="field">
                        <label class="label" for="regLastName">Фамилия</label>
                        <input id="regLastName" class="input" type="text" placeholder="Иванов"
                               required autocomplete="family-name" aria-describedby="regLastNameError">
                        <p id="regLastNameError" class="error is-hidden" role="alert"></p>
                    </div>
                </div>
                <div class="field">
                    <label class="label" for="regEmail">Эл. почта</label>
                    <input id="regEmail" class="input" type="email" inputmode="email"
                           placeholder="ivan@yandex.ru" required autocomplete="email"
                           aria-describedby="regEmailHint regEmailError">
                    <p id="regEmailHint" class="hint">
                        Поддерживаются: yandex.ru, mail.ru, internet.ru, bk.ru, list.ru, inbox.ru, ya.ru
                    </p>
                    <p id="regEmailError" class="error is-hidden" role="alert"></p>
                </div>
                <div class="field">
                    <label class="label" for="regPassword">Пароль</label>
                    <input id="regPassword" class="input" type="password" placeholder="Минимум 8 символов"
                           required autocomplete="new-password" aria-describedby="regPasswordError">
                    <p id="regPasswordError" class="error is-hidden" role="alert"></p>
                </div>
                <button id="registerSubmit" class="btn btn--primary btn--block" type="submit">
                    <span data-label>Зарегистрироваться</span>
                </button>
                <p id="registerResult" class="form-message is-hidden" role="alert"></p>
            </form>
        </section>
    </div>

    <p class="footnote">Ссылки только с доменами рунета</p>
</main>

<!-- Тосты -->
<div id="toaster" class="toast-wrap" aria-live="polite" aria-atomic="true"></div>

<script src="/app.js" type="module"></script>
</body>
</html>
